{% extends "base.html" %}
{% block title %}Lay‑Buy – {{ client.name }}{% endblock %}
{% block content %}

<style>
    .section-card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        border-left: 4px solid #d4af37;
    }
    .section-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #d4af37;
    }
    .btn-gold {
        background-color: #d4af37;
        color: black;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        transition: background-color 0.2s ease;
    }
    .btn-gold:hover { background-color: #b8952f; }

    .btn-black {
        background-color: black;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        transition: background-color 0.2s ease;
    }
    .btn-black:hover { background-color: #222; }

    .button-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 15px;
    }
</style>

<h1>Lay‑Buy: {{ client.name }}</h1>

<div class="section-card">
    <div class="section-title">Lay‑Buy Options</div>

    <div class="button-row">
        <form action="{{ url_for('client_laybuy_create', client_id=client.id) }}" method="get">
            <button type="submit" class="btn-gold">Create New Lay‑Buy</button>
        </form>

        <form action="{{ url_for('client_laybuy_manage', client_id=client.id) }}" method="get">
            <button type="submit" class="btn-black">Manage Existing Lay‑Buy</button>
        </form>
    </div>
</div>

{% endblock %}
