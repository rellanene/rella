{% extends "base.html" %}
{% block title %}Sales{% endblock %}
{% block content %}
<h1>Sales</h1>

<style>
    /* GOLD BUTTON (Primary Action) */
    .btn-gold {
        background-color: #d4af37;
        color: #000;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        margin: 6px 4px;
        display: inline-block;
    }
    .btn-gold:hover {
        background-color: #c19b2f;
    }

    /* BLACK BUTTON (Secondary Action) */
    .btn-black {
        background-color: #1f2937;
        color: #fff;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        margin: 6px 4px;
        display: inline-block;
    }
    .btn-black:hover {
        background-color: #111827;
    }
</style>

<div class="card">

  <!-- SALES FORM -->
  <form id="sales-form" class="add-form">

    <!-- HIDDEN TOTAL FIELDS -->
    <input type="hidden" name="subtotal" id="hidden-subtotal">
    <input type="hidden" name="vat" id="hidden-vat">
    <input type="hidden" name="total" id="hidden-total">

    <!-- BARCODE INPUT -->
    <input id="barcode-input" placeholder="Scan barcode or type barcode manually" autocomplete="off">

    <!-- ADD ITEM BUTTON -->
    <button type="button" id="add-item-btn" class="btn-black">Add Item</button>

    <!-- SALES TABLE -->
    <table class="data-table" id="sales-items-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Price (Incl VAT)</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="itemsTableBody"></tbody>
    </table>

    <!-- BUTTONS TO SELECT CLIENT & STORE -->
    <button type="button" id="open-client" class="btn-gold">Select Client</button>
    <button type="button" id="open-store" class="btn-gold">Select Store</button>

    <!-- CLIENT -->
    <select name="client_id" id="client_id" style="display:none;">
      <option value="">Select client</option>
      {% for c in clients %}
      <option value="{{ c.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>

    <!-- STORE -->
    <select name="store_id" id="store_id" style="display:none;">
      <option value="">Select store</option>
      {% for s in stores %}
      <option value="{{ s.id }}">{{ s.name }}</option>
      {% endfor %}
    </select>

    <!-- TOTALS -->
    <p>Subtotal (Ex VAT): <span id="sales-subtotal">0.00</span></p>
    <p>VAT (15%): <span id="sales-vat">0.00</span></p>
    <p><strong>Grand Total: <span id="sales-total">0.00</span></strong></p>

    <!-- COMPLETE SALE BUTTON -->
    <button type="button" id="submit-sale-btn" class="btn-gold">Complete Sale</button>

  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  const barcodeInput = document.getElementById("barcode-input");
  let dropdownMode = false;

  /* ----------------------------------------------------
     ALWAYS KEEP BARCODE INPUT FOCUSED (YOUR ORIGINAL CODE)
  ---------------------------------------------------- */
  function focusScanner() {
      barcodeInput.focus();
      barcodeInput.select();
  }

  focusScanner();

  document.addEventListener("click", function(e) {
      if (!dropdownMode && !barcodeInput.contains(e.target)) {
          focusScanner();
      }
  });

  /* ----------------------------------------------------
     BUTTONS TO OPEN CLIENT & STORE DROPDOWNS
  ---------------------------------------------------- */
  document.getElementById("open-client").addEventListener("click", function() {
      dropdownMode = true;
      const c = document.getElementById("client_id");
      c.style.display = "block";
      c.focus();
  });

  document.getElementById("open-store").addEventListener("click", function() {
      dropdownMode = true;
      const s = document.getElementById("store_id");
      s.style.display = "block";
      s.focus();
  });

  document.getElementById("client_id").addEventListener("change", function() {
      dropdownMode = false;
      this.style.display = "none";
      focusScanner();
  });

  document.getElementById("store_id").addEventListener("change", function() {
      dropdownMode = false;
      this.style.display = "none";
      focusScanner();
  });

  /* ----------------------------------------------------
     SCANNER HANDLER
  ---------------------------------------------------- */
  barcodeInput.addEventListener("keyup", function(e) {
      if (e.key === "Enter") {
          const code = barcodeInput.value.trim();
          if (code.length > 0) processScan(code);
          barcodeInput.value = "";
          focusScanner();
      }
  });

  barcodeInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" || e.key === "Tab") {
          e.preventDefault();
      }
  });

  /* ----------------------------------------------------
     PROCESS SCAN
  ---------------------------------------------------- */
  function processScan(code) {
      fetch(`/check_barcode?code=${code}`)
        .then(r => r.json())
        .then(data => {

          if (!data.found) {
            alert("Product not found");
            return;
          }

          const existingRow = findRowByProductId(data.id);

          if (existingRow) {
              increaseQty(existingRow);
          } else {
              addRow({
                  id: data.id,
                  name: data.name,
                  price: parseFloat(data.price),
                  barcode: data.barcode
              });
          }

          updateTotal();
          focusScanner();
        });
  }

  /* ----------------------------------------------------
     FIND EXISTING ROW
  ---------------------------------------------------- */
  function findRowByProductId(productId) {
      const rows = document.querySelectorAll(".item-row");
      for (let row of rows) {
          const select = row.querySelector(".product-select");
          if (select && select.value == productId) return row;
      }
      return null;
  }

  /* ----------------------------------------------------
     INCREASE QTY
  ---------------------------------------------------- */
  function increaseQty(row) {
      const qtyInput = row.querySelector(".qty-input");
      const priceInput = row.querySelector(".price-input");
      const totalInput = row.querySelector(".total-input");

      let qty = parseFloat(qtyInput.value) || 1;
      let price = parseFloat(priceInput.value) || 0;

      qty += 1;
      qtyInput.value = qty;
      totalInput.value = (qty * price).toFixed(2);

      updateTotal();
  }

  /* ----------------------------------------------------
     ADD NEW ROW
  ---------------------------------------------------- */
  function addRow(product) {
      const tbody = document.getElementById("itemsTableBody");

      const row = document.createElement("tr");
      row.classList.add("item-row");

      row.innerHTML = `
        <td>
          <select class="product-select" name="product_id[]" onchange="manualSelect(this)">
            <option value="">Select product</option>
            {% for p in products %}
            <option value="{{ p.id }}" data-price="{{ p.price }}" data-barcode="{{ p.barcode }}">
              {{ p.name }}
            </option>
            {% endfor %}
          </select>
        </td>

        <td><input type="number" name="qty[]" class="qty-input" value="1" min="1"></td>
        <td><input type="text" name="price[]" class="price-input" readonly></td>
        <td><input type="text" name="total[]" class="total-input" readonly></td>
        <td><button type="button" class="remove-btn btn-black">X</button></td>
      `;

      tbody.appendChild(row);

      if (product) {
          const select = row.querySelector(".product-select");
          select.value = product.id;
          row.querySelector(".price-input").value = product.price.toFixed(2);
          row.querySelector(".total-input").value = product.price.toFixed(2);
      }

      updateTotal();
  }

  /* ----------------------------------------------------
     MANUAL SELECT
  ---------------------------------------------------- */
  window.manualSelect = function(select) {
      const price = parseFloat(select.options[select.selectedIndex].dataset.price || 0);
      const row = select.closest("tr");

      row.querySelector(".price-input").value = price.toFixed(2);
      row.querySelector(".qty-input").value = 1;
      row.querySelector(".total-input").value = price.toFixed(2);

      updateTotal();
  };

  /* ----------------------------------------------------
     UPDATE TOTALS
  ---------------------------------------------------- */
  function updateTotal() {
      let subtotal = 0;
      let vatTotal = 0;
      let grandTotal = 0;

      document.querySelectorAll(".item-row").forEach(row => {
          const qty = parseFloat(row.querySelector(".qty-input").value) || 1;
          const price = parseFloat(row.querySelector(".price-input").value) || 0;

          const vat = price * 15 / 115;
          const net = price - vat;

          subtotal += net * qty;
          vatTotal += vat * qty;
          grandTotal += price * qty;
      });

      document.getElementById("sales-subtotal").innerText = subtotal.toFixed(2);
      document.getElementById("sales-vat").innerText = vatTotal.toFixed(2);
      document.getElementById("sales-total").innerText = grandTotal.toFixed(2);

      document.getElementById("hidden-subtotal").value = subtotal.toFixed(2);
      document.getElementById("hidden-vat").value = vatTotal.toFixed(2);
      document.getElementById("hidden-total").value = grandTotal.toFixed(2);
  }

  /* ----------------------------------------------------
     REMOVE ROW
  ---------------------------------------------------- */
  document.addEventListener("click", function(e) {
      if (e.target.classList.contains("remove-btn")) {
          e.target.closest("tr").remove();
          updateTotal();
      }
  });

  /* ----------------------------------------------------
     SUBMIT SALE
  ---------------------------------------------------- */
  document.getElementById("submit-sale-btn").addEventListener("click", function() {

      updateTotal();

	  document.getElementById("submit-sale-btn").addEventListener("click", function() {

	      updateTotal();

	      const form = document.getElementById("sales-form");
	      const formData = new FormData(form);  // this is enough

	      fetch("/record_sale", {
	        method: "POST",
	        body: formData
	      })
	      .then(r => r.json())
	      .then(res => {
	        if (res.success) {
	          alert("Sale completed");
	          location.reload();
	        } else {
	          alert("Error: " + res.error);
	        }
	      });
	  });


      fetch("/record_sale", {
        method: "POST",
        body: formData
      })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          alert("Sale completed");
          location.reload();
        } else {
          alert("Error: " + res.error);
        }
      });
  });

});
</script>

{% endblock %}
