{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<style>
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 28px;
    margin-top: 25px;
}

/* Bigger, premium-looking cards */
.card-box {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
}

/* Larger titles */
.card-title {
    font-weight: 700;
    font-size: 1.3rem;
    margin-bottom: 18px;
    color: #000;
}

/* Chart container FIX */
.chart-container {
    width: 100%;
    height: 320px !important;
    position: relative;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

/* DARK MODE THEME */
body.dark-mode {
    background: #111;
    color: #eee;
}

body.dark-mode .card-box {
    background: #1a1a1a;
    color: #eee;
    box-shadow: 0 0 10px rgba(255,255,255,0.05);
}

body.dark-mode .card-title {
    color: #f5f5f5;
}

body.dark-mode .container h2 {
    color: #fff;
}

/* Smooth transition */
body, .card-box {
    transition: background 0.3s ease, color 0.3s ease;
}

/* Toggle button */
#darkModeToggle {
    position: absolute;
    top: 20px;
    right: 30px;
    background: #d4af37;
    color: #000;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

body.dark-mode #darkModeToggle {
    background: #444;
    color: #fff;
}
</style>

<div class="container mt-4">

    <h2>Dashboard</h2>
	
    <button id="darkModeToggle">Dark Mode</button>

    {% if user.role == 'staff' %}
    <!-- ========================================================= -->
    <!-- STAFF DASHBOARD -->
    <!-- ========================================================= -->

    <div class="dashboard-grid">

        <div class="card-box">
            <div class="card-title">My Tasks Overview</div>
            <div class="chart-container">
                <canvas id="tasksStatusChart"></canvas>
            </div>
        </div>

        <div class="card-box">
            <div class="card-title">Tasks by Priority</div>
            <div class="chart-container">
                <canvas id="tasksPriorityChart"></canvas>
            </div>
        </div>

    </div>

    {% else %}
    <!-- ========================================================= -->
    <!-- ADMIN DASHBOARD -->
    <!-- ========================================================= -->

    <div class="dashboard-grid">
		
		<div class="card-box">
		            <div class="card-title">Stores Stock Levels</div>
		            <div class="chart-container">
		                <canvas id="storesChart"></canvas>
		            </div>
		        </div>

        <div class="card-box">
            <div class="card-title">Products Overview</div>
            <div class="chart-container">
                <canvas id="productsChart"></canvas>
            </div>
        </div>
		
		<div class="card-box">
		            <div class="card-title">Finances Summary</div>
		            <div class="chart-container">
		                <canvas id="financesChart"></canvas>
		            </div>
		        </div>        

        <div class="card-box">
            <div class="card-title">Sales Records</div>
            <div class="chart-container">
                <canvas id="recordsChart"></canvas>
            </div>
        </div>
		
		<div class="card-box">
		            <div class="card-title">Clients Growth</div>
		            <div class="chart-container">
		                <canvas id="clientsChart"></canvas>
		            </div>
		        </div>

        

        

    </div>

    {% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* DARK MODE TOGGLE */
const toggleBtn = document.getElementById("darkModeToggle");

if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");
    toggleBtn.textContent = "Light Mode";
}

toggleBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkMode", "enabled");
        toggleBtn.textContent = "Light Mode";
    } else {
        localStorage.setItem("darkMode", "disabled");
        toggleBtn.textContent = "Dark Mode";
    }
});

/* Chart text color helper */
function chartTextColor() {
    return document.body.classList.contains("dark-mode") ? "#fff" : "#000";
}

/* Animation config */
const chartAnimation = {
    duration: 1200,
    easing: 'easeOutQuart',
    delay: (context) => context.dataIndex * 120
};

/* ============================================================
   STAFF DASHBOARD CHARTS
============================================================ */
{% if user.role == 'staff' %}

new Chart(document.getElementById('tasksStatusChart'), {
    type: 'doughnut',
    data: {
        labels: ['Pending', 'In Progress', 'Completed'],
        datasets: [{
            data: {{ tasks_status_data | safe }},
            backgroundColor: ['#d4af37', '#f0c75e', '#444']
        }]
    },
    options: {
        animation: chartAnimation,
        plugins: { legend: { labels: { color: chartTextColor() } } }
    }
});

new Chart(document.getElementById('tasksPriorityChart'), {
    type: 'bar',
    data: {
        labels: ['Low', 'Medium', 'High'],
        datasets: [{
            label: 'Tasks',
            data: {{ tasks_priority_data | safe }},
            backgroundColor: ['#f1e3b3', '#d4af37', '#b8860b']
        }]
    },
    options: {
        animation: chartAnimation,
        scales: {
            x: { ticks: { color: chartTextColor() } },
            y: { ticks: { color: chartTextColor() } }
        },
        plugins: { legend: { labels: { color: chartTextColor() } } }
    }
});

{% else %}

/* ============================================================
   ADMIN DASHBOARD CHARTS
============================================================ */

new Chart(document.getElementById('productsChart'), {
    type: 'bar',
    data: {
        labels: {{ products_labels | safe }},
        datasets: [{
            label: 'Stock Levels',
            data: {{ products_data | safe }},
            backgroundColor: '#d4af37'
        }]
    },
    options: {
        animation: chartAnimation,
        scales: {
            x: { ticks: { color: chartTextColor() } },
            y: { ticks: { color: chartTextColor() } }
        },
        plugins: { legend: { labels: { color: chartTextColor() } } }
    }
});

new Chart(document.getElementById('clientsChart'), {
    type: 'line',
    data: {
        labels: {{ clients_labels | safe }},
        datasets: [{
            label: 'New Clients',
            data: {{ clients_data | safe }},
            borderColor: '#d4af37',
            fill: false
        }]
    },
    options: {
        animation: chartAnimation,
        tension: 0.4,
        scales: {
            x: { ticks: { color: chartTextColor() } },
            y: { ticks: { color: chartTextColor() } }
        },
        plugins: { legend: { labels: { color: chartTextColor() } } }
    }
});

new Chart(document.getElementById('recordsChart'), {
    type: 'line',
    data: {
        labels: {{ records_labels | safe }},
        datasets: [{
            label: 'Sales',
            data: {{ records_data | safe }},
            borderColor: '#444',
            fill: false
        }]
    },
    options: {
        animation: chartAnimation,
        tension: 0.35,
        scales: {
            x: { ticks: { color: chartTextColor() } },
            y: { ticks: { color: chartTextColor() } }
        },
        plugins: { legend: { labels: { color: chartTextColor() } } }
    }
});

new Chart(document.getElementById('storesChart'), {
    type: 'bar',
    data: {
        labels: {{ stores_labels | safe }},
        datasets: [{
            label: 'Stock',
            data: {{ stores_data | safe }},
            backgroundColor: '#f0c75e'
        }]
    },
    options: {
        animation: chartAnimation,
        scales: {
            x: { ticks: { color: chartTextColor() } },
            y: { ticks: { color: chartTextColor() } }
        },
        plugins: { legend: { labels: { color: chartTextColor() } } }
    }
});

new Chart(document.getElementById('financesChart'), {
    type: 'pie',
    data: {
        labels: ['Income', 'Expenses', 'Stock Cost'],
        datasets: [{
            data: {{ finances_data | safe }},
            backgroundColor: ['#d4af37', '#444', '#b8860b']
        }]
    },
    options: {
        animation: chartAnimation,
        plugins: { legend: { labels: { color: chartTextColor() } } }
    }
});

{% endif %}
</script>

{% endblock %}
