<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RELLA - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='rella.css') }}">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  #toast-container {
      position: fixed;
      top: 70px; /* pushes below navbar */
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
  }

  .toast {
      min-width: 260px;
      background: #0A1A2F;
      color: white;
      padding: 12px 18px;
      margin-top: 8px;
      border-radius: 6px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(-20px);
      transition: all .35s ease;
      pointer-events: auto;
      border-left: 5px solid #d4af37;
  }

  .toast.show {
      opacity: 1;
      transform: translateY(0);
  }

  .toast.success { border-color: #28a745; }
  .toast.error   { border-color: #dc3545; }
  .toast.info    { border-color: #007bff; }
  .toast.warn    { border-color: #ffc107; }
  </style>
  <style>
  #rellabot-messages {
      background: rgba(255,0,0,0.2) !important;
  }
  #rellabot-messages {
      background-color: #0A1A2F;   /* deep navy background */
      color: #f5f5f5;              /* light text for visibility */
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
  }
  
  #rellabot-messages div {
      border-bottom: 1px solid rgba(212,175,55,0.2);
      padding-bottom: 4px;
      margin-bottom: 4px;
  }

  #rellabot-window {
      background-color: #ffffff;   /* light chat window */
      border: 2px solid #d4af37;
      box-shadow: 0 0 12px rgba(212,175,55,0.4);
  }

  #rellabot-messages strong {
      color: #d4af37;              /* gold sender names */
  }

  #rellabot-messages div {
      margin-bottom: 6px;
      line-height: 1.4;
  }

  </style>


</head>
<body>
  <header class="navbar">
    <div class="brand">RELLA</div>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.path=='/' or request.path.startswith('/dashboard') %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('products') }}" class="nav-link {% if request.path.startswith('/products') %}active{% endif %}">Products</a>
      <a href="{{ url_for('clients') }}" class="nav-link {% if request.path.startswith('/clients') %}active{% endif %}">Clients</a>
      <a href="{{ url_for('sales') }}" class="nav-link {% if request.path.startswith('/sales') %}active{% endif %}">Sales</a>
      <a href="{{ url_for('pos') }}" class="nav-link {% if request.path.startswith('/pos') %}active{% endif %}">POS</a>
      <a href="{{ url_for('records') }}" class="nav-link {% if request.path.startswith('/records') %}active{% endif %}">Records</a>
      <a href="{{ url_for('stores') }}" class="nav-link {% if request.path.startswith('/stores') %}active{% endif %}">Stores</a>
      <a href="{{ url_for('stock_in') }}" class="nav-link {% if request.path.startswith('/stock-in') %}active{% endif %}">Stock In</a>
      <a href="{{ url_for('transfer') }}" class="nav-link {% if request.path.startswith('/transfer') %}active{% endif %}">Transfer</a>
      <a href="{{ url_for('movements') }}" class="nav-link {% if request.path.startswith('/movements') %}active{% endif %}">Movements</a>
      <a href="{{ url_for('human') }}" class="nav-link {% if request.path.startswith('/human') %}active{% endif %}">Human</a>
      <a href="{{ url_for('comms') }}" class="nav-link {% if request.path.startswith('/comms') %}active{% endif %}">Comms</a>
      <a href="{{ url_for('finances') }}" class="nav-link {% if request.path.startswith('/finances') %}active{% endif %}">Finances</a>
      <a href="{{ url_for('tasks') }}" class="nav-link {% if request.path.startswith('/tasks') %}active{% endif %}">Tasks</a>
      <a href="{{ url_for('permissions_page') }}" class="nav-link {% if request.path.startswith('/permissions') %}active{% endif %}">Permissions</a>
      <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
    </nav>
  </header>
  <!-- Toast Container (Top Center, Below Navbar) -->
  <div id="toast-container"></div>


  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <script>
          window.__RELLA_TOASTS = window.__RELLA_TOASTS || [];
          {% for cat, msg in messages %}
            window.__RELLA_TOASTS.push({category: "{{ cat }}", message: "{{ msg|escape }}"}); 
          {% endfor %}
        </script>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  


  <!-- RELLAbot Floating Button -->
  <div id="rellabot-button">
      🤖
  </div>

  <!-- RELLAbot Chat Window -->
  <div id="rellabot-window">
      <div id="rellabot-header">
          <span>RELLAbot</span>
          <button id="rellabot-close">×</button>
      </div>

      <div id="rellabot-messages"></div>

      <div id="rellabot-controls">
          <button id="rellabot-continue">Continue Chat</button>
          <button id="rellabot-new">New Chat</button>
      </div>

      <div id="rellabot-input-area">
          <input id="rellabot-input" type="text" placeholder="Ask me anything…">
          <button id="rellabot-send">Send</button>
      </div>
  </div>
 

  
  
  <script>
  window.RELLA = {
      toast: function (message, type = "info") {
          const container = document.getElementById("toast-container");

          const box = document.createElement("div");
          box.className = "toast " + type;
          box.innerText = message;

          container.appendChild(box);

          setTimeout(() => box.classList.add("show"), 10);

          setTimeout(() => {
              box.classList.remove("show");
              setTimeout(() => box.remove(), 300);
          }, 3500);
      }
  };
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", function() {
      {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
              {% for category, message in messages %}
                  window.RELLA.toast("{{ message }}", "{{ category }}");
              {% endfor %}
          {% endif %}
      {% endwith %}
  });
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("yourFormID");
      if (!form) return; // prevents JS crash

      form.addEventListener("submit", function(e) {
          let invalid = false;

          this.querySelectorAll("input, select, textarea").forEach(el => {
              if (el.hasAttribute("required") && !el.value.trim()) {
                  invalid = true;
              }
          });

          if (invalid) {
              e.preventDefault();
              window.RELLA.toast("Please fill in all required fields", "error");
          }
      });
  });
  </script>



  <script>
  document.addEventListener("DOMContentLoaded", function () {
      console.log("RELLAbot inline JS loaded");

      let history = [];

      const btn = document.getElementById("rellabot-button");
      const win = document.getElementById("rellabot-window");
      const closeBtn = document.getElementById("rellabot-close");
      const newBtn = document.getElementById("rellabot-new");
      const contBtn = document.getElementById("rellabot-continue");
      const sendBtn = document.getElementById("rellabot-send");
      const input = document.getElementById("rellabot-input");
      const messages = document.getElementById("rellabot-messages");

      btn.onclick = () => win.style.display = "flex";
      closeBtn.onclick = () => win.style.display = "none";

	  newBtn.addEventListener("click", function () {
	      if (!win.style.display || win.style.display === "none") return;
	      history = [];
	      messages.innerHTML = "";
	  });


      contBtn.onclick = () => {
          messages.innerHTML = history.join("");
      };

      sendBtn.onclick = sendMessage;
      input.onkeypress = e => { if (e.key === "Enter") sendMessage(); };

	  function sendMessage() {
	      const msg = input.value.trim();
	      if (!msg) return;

	      win.style.display = "flex";  // auto-open bot window

	      append("You", msg);
	      input.value = "";

	      fetch("/rellabot/query", {
	          method: "POST",
	          headers: {"Content-Type": "application/json"},
	          body: JSON.stringify({message: msg})
	      })
	      .then(r => r.json())
	      .then(data => {
	          append("RELLAbot", data.reply);
	      });
	  }


      function append(sender, text) {
          const html = `<div><strong>${sender}:</strong> ${text}</div>`;
          messages.innerHTML += html;
          history.push(html);
          messages.scrollTop = messages.scrollHeight;
      }
  });
  </script>


</body>
</html>
