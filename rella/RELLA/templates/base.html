<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RELLA - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='rella.css') }}">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  #toast-container {
      position: fixed;
      top: 70px; /* pushes below navbar */
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
  }

  .toast {
      min-width: 260px;
      background: #0A1A2F;
      color: white;
      padding: 12px 18px;
      margin-top: 8px;
      border-radius: 6px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(-20px);
      transition: all .35s ease;
      pointer-events: auto;
      border-left: 5px solid #d4af37;
  }

  .toast.show {
      opacity: 1;
      transform: translateY(0);
  }

  .toast.success { border-color: #28a745; }
  .toast.error   { border-color: #dc3545; }
  .toast.info    { border-color: #007bff; }
  .toast.warn    { border-color: #ffc107; }
  </style>
  <style>
	#rellabot-header {
	    background-color: #c9dcff; /* richer, medium-light blue */
	    color: #0A1A2F;            /* dark navy text for contrast */
	    font-weight: bold;
	    padding: 8px 12px;
	    border-bottom: 2px solid #d4af37; /* gold accent line */
	    display: flex;
	    justify-content: space-between;
	    align-items: center;
	    border-top-left-radius: 6px;
	    border-top-right-radius: 6px;
	    box-shadow: 0 2px 4px rgba(212,175,55,0.25);
	}

	/* Header text */
	#rellabot-header span {
	    color: #0A1A2F;
	    font-size: 15px;
	    font-weight: 600;
	}


	/* Close button fix */
	#rellabot-close {
	    background-color: #ffffff;
	    color: #0A1A2F;
	    border: 1.5px solid #d4af37;
	    border-radius: 8px;
	    cursor: pointer;
	    font-weight: bold;
	    width: 30px;
	    height: 30px;
	    text-align: center;
	    line-height: 28px; /* centers the “×” vertically */
	    font-size: 18px;   /* makes the “×” clearly visible */
	    box-shadow: 0 1px 3px rgba(212,175,55,0.3);
	    transition: all 0.3s ease;
	    display: flex;
	    justify-content: center;
	    align-items: center;
	}
	#rellabot-close:hover {
	    background-color: #d4af37;
	    color: #ffffff;
	    transform: scale(1.05);
	}


	/* Chat container */
	#rellabot-messages {
	    background-color: #e8f1ff; /* light pastel blue */
	    color: #0A1A2F;
	    padding: 12px;
	    overflow-y: auto;
	    font-size: 14px;
	    display: flex;
	    flex-direction: column;
	    gap: 6px;
	}

	/* Chat bubbles */
	#rellabot-messages .bubble {
	    max-width: 80%;
	    padding: 10px 14px;
	    border-radius: 18px;
	    line-height: 1.4;
	    word-wrap: break-word;
	    display: inline-block;
	}

	/* User bubble */
	#rellabot-messages .bubble.user {
	    background-color: #007bff;
	    color: #fff;
	    align-self: flex-end;
	    border-bottom-right-radius: 4px;
	}

	/* Bot bubble */
	#rellabot-messages .bubble.bot {
	    background-color: #ffffff;
	    color: #0A1A2F;
	    align-self: flex-start;
	    border-bottom-left-radius: 4px;
	}

	/* Clickable options */
	.rellabot-option {
	    background-color: #d4af37;
	    color: #0A1A2F;
	    border: none;
	    border-radius: 20px;
	    padding: 8px 14px;
	    margin: 4px;
	    cursor: pointer;
	    font-size: 14px;
	    font-weight: bold;
	    transition: background 0.3s;
	}
	.rellabot-option:hover {
	    background-color: #b8962e;
	}

	/* Chat window */
	#rellabot-window {
	    background-color: #ffffff;
	    border: 2px solid #d4af37;
	    box-shadow: 0 0 12px rgba(212,175,55,0.4);
	    border-radius: 8px;
	}

	/* Sender names */
	#rellabot-messages strong {
	    color: #d4af37;
	}

	/* Smooth animation for new messages */
	#rellabot-messages .bubble {
	    animation: fadeIn 0.3s ease-in-out;
	}
	@keyframes fadeIn {
	    from { opacity: 0; transform: translateY(10px); }
	    to { opacity: 1; transform: translateY(0); }
	}

	.rellabot-option {
	    background-color: #d4af37;
	    color: #0A1A2F;
	    border: none;
	    border-radius: 20px;
	    padding: 8px 14px;
	    margin: 4px;
	    cursor: pointer;
	    font-size: 14px;
	    font-weight: bold;
	    transition: background 0.3s, transform 0.2s;
	}
	.rellabot-option:hover {
	    background-color: #b8962e;
	    transform: scale(1.05);
	}



  </style>


</head>
<body>
  <header class="navbar">
    <div class="brand">RELLA</div>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.path=='/' or request.path.startswith('/dashboard') %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('products') }}" class="nav-link {% if request.path.startswith('/products') %}active{% endif %}">Products</a>
      <a href="{{ url_for('clients') }}" class="nav-link {% if request.path.startswith('/clients') %}active{% endif %}">Clients</a>
      <a href="{{ url_for('sales') }}" class="nav-link {% if request.path.startswith('/sales') %}active{% endif %}">Sales</a>
      <a href="{{ url_for('pos') }}" class="nav-link {% if request.path.startswith('/pos') %}active{% endif %}">POS</a>
      <a href="{{ url_for('records') }}" class="nav-link {% if request.path.startswith('/records') %}active{% endif %}">Records</a>
      <a href="{{ url_for('stores') }}" class="nav-link {% if request.path.startswith('/stores') %}active{% endif %}">Stores</a>
      <a href="{{ url_for('stock_in') }}" class="nav-link {% if request.path.startswith('/stock-in') %}active{% endif %}">Stock In</a>
      <a href="{{ url_for('transfer') }}" class="nav-link {% if request.path.startswith('/transfer') %}active{% endif %}">Transfer</a>
      <a href="{{ url_for('movements') }}" class="nav-link {% if request.path.startswith('/movements') %}active{% endif %}">Movements</a>
      <a href="{{ url_for('human') }}" class="nav-link {% if request.path.startswith('/human') %}active{% endif %}">Human</a>
      <a href="{{ url_for('comms') }}" class="nav-link {% if request.path.startswith('/comms') %}active{% endif %}">Comms</a>
      <a href="{{ url_for('finances') }}" class="nav-link {% if request.path.startswith('/finances') %}active{% endif %}">Finances</a>
      <a href="{{ url_for('tasks') }}" class="nav-link {% if request.path.startswith('/tasks') %}active{% endif %}">Tasks</a>
      <a href="{{ url_for('permissions_page') }}" class="nav-link {% if request.path.startswith('/permissions') %}active{% endif %}">Permissions</a>
      <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
    </nav>
  </header>
  <!-- Toast Container (Top Center, Below Navbar) -->
  <div id="toast-container"></div>


  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <script>
          window.__RELLA_TOASTS = window.__RELLA_TOASTS || [];
          {% for cat, msg in messages %}
            window.__RELLA_TOASTS.push({category: "{{ cat }}", message: "{{ msg|escape }}"}); 
          {% endfor %}
        </script>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  


  <!-- RELLAbot Floating Button -->
  <div id="rellabot-button">
      🤖
  </div>

  <!-- RELLAbot Chat Window -->
  <div id="rellabot-window">
      <div id="rellabot-header">
          <span>RELLAbot</span>
          <button id="rellabot-close">×</button>
      </div>

      <div id="rellabot-messages"></div>

      <div id="rellabot-controls">
          <button id="rellabot-continue">Continue Chat</button>
          <button id="rellabot-new">New Chat</button>
      </div>

      <div id="rellabot-input-area">
          <input id="rellabot-input" type="text" placeholder="Ask me anything…">
          <button id="rellabot-send">Send</button>
      </div>
  </div>
 

  
  
  <script>
  window.RELLA = {
      toast: function (message, type = "info") {
          const container = document.getElementById("toast-container");

          const box = document.createElement("div");
          box.className = "toast " + type;
          box.innerText = message;

          container.appendChild(box);

          setTimeout(() => box.classList.add("show"), 10);

          setTimeout(() => {
              box.classList.remove("show");
              setTimeout(() => box.remove(), 300);
          }, 3500);
      }
  };
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", function() {
      {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
              {% for category, message in messages %}
                  window.RELLA.toast("{{ message }}", "{{ category }}");
              {% endfor %}
          {% endif %}
      {% endwith %}
  });
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("yourFormID");
      if (!form) return; // prevents JS crash

      form.addEventListener("submit", function(e) {
          let invalid = false;

          this.querySelectorAll("input, select, textarea").forEach(el => {
              if (el.hasAttribute("required") && !el.value.trim()) {
                  invalid = true;
              }
          });

          if (invalid) {
              e.preventDefault();
              window.RELLA.toast("Please fill in all required fields", "error");
          }
      });
  });
  </script>



  <script>
  document.addEventListener("DOMContentLoaded", function () {
      console.log("RELLAbot inline JS loaded");

      let history = [];

      const btn = document.getElementById("rellabot-button");
      const win = document.getElementById("rellabot-window");
      const closeBtn = document.getElementById("rellabot-close");
      const newBtn = document.getElementById("rellabot-new");
      const contBtn = document.getElementById("rellabot-continue");
      const sendBtn = document.getElementById("rellabot-send");
      const input = document.getElementById("rellabot-input");
      const messages = document.getElementById("rellabot-messages");

      btn.onclick = () => win.style.display = "flex";
      closeBtn.onclick = () => win.style.display = "none";

	  newBtn.addEventListener("click", function () {
	      if (!win.style.display || win.style.display === "none") return;
	      history = [];
	      messages.innerHTML = "";
	  });


      contBtn.onclick = () => {
          messages.innerHTML = history.join("");
      };

      sendBtn.onclick = sendMessage;
      input.onkeypress = e => { if (e.key === "Enter") sendMessage(); };

	  function sendMessage() {
	      const msg = input.value.trim();
	      if (!msg) return;

	      win.style.display = "flex";  // auto-open bot window

	      append("You", msg);
	      input.value = "";

		  fetch("/rellabot/query", {
		  	          method: "POST",
		  	          headers: {"Content-Type": "application/json"},
		  	          body: JSON.stringify({message: msg})
		  	      })
		  	      .then(r => r.json())
		  	      .then(data => {
		  	          append("RELLAbot", data.reply);
		  	      });
	  }


	  function append(sender, text, options = []) {
	      const div = document.createElement("div");
	      div.className = sender === "You" ? "bubble user" : "bubble bot";
	      div.innerHTML = `<strong>${sender}:</strong> ${text}`;
	      messages.appendChild(div);

	      // Add clickable options if provided
	      if (options.length > 0) {
	          const btnContainer = document.createElement("div");
	          options.forEach(opt => {
	              const btn = document.createElement("button");
	              btn.className = "rellabot-option";
	              btn.textContent = opt;
	              btn.onclick = () => sendMessage(opt);
	              btnContainer.appendChild(btn);
	          });
	          messages.appendChild(btnContainer);
	      }

	      history.push(div.outerHTML);
	      messages.scrollTop = messages.scrollHeight;
	  }

  });
  </script>


</body>
</html>
