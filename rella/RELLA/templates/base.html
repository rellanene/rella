<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RELLA - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='rella.css') }}">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  #toast-container {
      position: fixed;
      top: 70px; /* pushes below navbar */
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
  }

  .toast {
      min-width: 260px;
      background: #0A1A2F;
      color: white;
      padding: 12px 18px;
      margin-top: 8px;
      border-radius: 6px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(-20px);
      transition: all .35s ease;
      pointer-events: auto;
      border-left: 5px solid #d4af37;
  }

  .toast.show {
      opacity: 1;
      transform: translateY(0);
  }

  .toast.success { border-color: #28a745; }
  .toast.error   { border-color: #dc3545; }
  .toast.info    { border-color: #007bff; }
  .toast.warn    { border-color: #ffc107; }
  </style>

</head>
<body>
  <header class="navbar">
    <div class="brand">RELLA</div>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.path=='/' or request.path.startswith('/dashboard') %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('products') }}" class="nav-link {% if request.path.startswith('/products') %}active{% endif %}">Products</a>
      <a href="{{ url_for('clients') }}" class="nav-link {% if request.path.startswith('/clients') %}active{% endif %}">Clients</a>
      <a href="{{ url_for('sales') }}" class="nav-link {% if request.path.startswith('/sales') %}active{% endif %}">Sales</a>
      <a href="{{ url_for('pos') }}" class="nav-link {% if request.path.startswith('/pos') %}active{% endif %}">POS</a>
      <a href="{{ url_for('records') }}" class="nav-link {% if request.path.startswith('/records') %}active{% endif %}">Records</a>
      <a href="{{ url_for('stores') }}" class="nav-link {% if request.path.startswith('/stores') %}active{% endif %}">Stores</a>
      <a href="{{ url_for('stock_in') }}" class="nav-link {% if request.path.startswith('/stock-in') %}active{% endif %}">Stock In</a>
      <a href="{{ url_for('transfer') }}" class="nav-link {% if request.path.startswith('/transfer') %}active{% endif %}">Transfer</a>
      <a href="{{ url_for('movements') }}" class="nav-link {% if request.path.startswith('/movements') %}active{% endif %}">Movements</a>
      <a href="{{ url_for('human') }}" class="nav-link {% if request.path.startswith('/human') %}active{% endif %}">Human</a>
      <a href="{{ url_for('comms') }}" class="nav-link {% if request.path.startswith('/comms') %}active{% endif %}">Comms</a>
      <a href="{{ url_for('finances') }}" class="nav-link {% if request.path.startswith('/finances') %}active{% endif %}">Finances</a>
      <a href="{{ url_for('tasks') }}" class="nav-link {% if request.path.startswith('/tasks') %}active{% endif %}">Tasks</a>
      <a href="{{ url_for('permissions_page') }}" class="nav-link {% if request.path.startswith('/permissions') %}active{% endif %}">Permissions</a>
      <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
    </nav>
  </header>
  <!-- Toast Container (Top Center, Below Navbar) -->
  <div id="toast-container"></div>


  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <script>
          window.__RELLA_TOASTS = window.__RELLA_TOASTS || [];
          {% for cat, msg in messages %}
            window.__RELLA_TOASTS.push({category: "{{ cat }}", message: "{{ msg|escape }}"}); 
          {% endfor %}
        </script>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="{{ url_for('static', filename='rella.js') }}"></script>
  <script>
  window.RELLA = {
      toast: function (message, type = "info") {
          const container = document.getElementById("toast-container");

          const box = document.createElement("div");
          box.className = "toast " + type;
          box.innerText = message;

          container.appendChild(box);

          setTimeout(() => box.classList.add("show"), 10);

          setTimeout(() => {
              box.classList.remove("show");
              setTimeout(() => box.remove(), 300);
          }, 3500);
      }
  };
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", function() {
      {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
              {% for category, message in messages %}
                  window.RELLA.toast("{{ message }}", "{{ category }}");
              {% endfor %}
          {% endif %}
      {% endwith %}
  });
  </script>
  <script>
  document.getElementById("yourFormID").addEventListener("submit", function(e) {
      let invalid = false;

      this.querySelectorAll("input, select, textarea").forEach(el => {
          if (el.hasAttribute("required") && !el.value.trim()) {
              invalid = true;
          }
      });

      if (invalid) {
          e.preventDefault();
          RELL A.toast("Please fill in all required fields", "error");
      }
  });
  </script>


</body>
</html>
