<!DOCTYPE html>
<html>
<head>
    <title>Client Statement</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>

<h2>Statement for {{ client.name }}</h2>

<p>
    {% if start_date %} From: {{ start_date }} {% endif %}
    {% if end_date %} To: {{ end_date }} {% endif %}
</p>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Reference</th>
            <th>Amount</th>
            <th>Balance</th>
        </tr>
    </thead>
    <tbody>
        {% for t in timeline %}
        <tr>
            <td>{{ t.date }}</td>
            <td>{{ t.type }}</td>
            <td>{{ t.ref }}</td>
            <td>{{ t.amount }}</td>
            <td>{{ t.balance }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    window.onload = function() {
        window.print();
        setTimeout(() => window.close(), 500);
    };
</script>

</body>
</html>
