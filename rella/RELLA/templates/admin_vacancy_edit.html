{% extends "base.html" %}

{% block content %}

<style>
    .hr-container {
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        margin-top: 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        font-family: Arial, sans-serif;
    }

    h2 {
        font-weight: bold;
        margin-bottom: 20px;
    }

    .back-btn {
        text-decoration: none;
        font-weight: bold;
        padding: 8px 14px;
        margin-bottom: 20px;
        display: inline-block;
        border-radius: 6px;
        background: #6c757d;
        color: white;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 6px;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    textarea {
        height: 120px;
        resize: vertical;
    }

    .hr-btn-save {
        background: #007bff;
        color: white;
        padding: 10px 18px;
        font-weight: bold;
        border-radius: 6px;
        text-decoration: none;
        border: none;
        cursor: pointer;
    }

    .hr-btn-delete {
        background: #dc3545;
        color: white;
        padding: 10px 18px;
        font-weight: bold;
        border-radius: 6px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        margin-left: 10px;
    }

    .button-row {
        margin-top: 25px;
    }
</style>

<div class="hr-container">

    <!-- BACK BUTTON -->
    <a href="{{ url_for('human') }}?tab=vacancies" class="back-btn"> Back to Job Vacancies</a>

    <h2>Edit Vacancy: {{ vacancy.title }}</h2>

    <form action="{{ url_for('admin_vacancy_edit', vacancy_id=vacancy.id) }}" method="POST">

        <div class="form-group">
            <label>Job Title</label>
            <input type="text" name="title" value="{{ vacancy.title }}" required>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" name="department" value="{{ vacancy.department }}" required>
        </div>

        <div class="form-group">
            <label>Closing Date</label>
            <input type="date" name="closing_date" value="{{ vacancy.closing_date }}" required>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select name="status" required>
                <option value="open" {% if vacancy.status == 'open' %}selected{% endif %}>Open</option>
                <option value="closed" {% if vacancy.status == 'closed' %}selected{% endif %}>Closed</option>
            </select>
        </div>

        <div class="form-group">
            <label>Job Description</label>
            <textarea name="description">{{ vacancy.description }}</textarea>
        </div>

        <div class="button-row">
            <button type="submit" class="hr-btn-save">Save Changes</button>

            <a href="{{ url_for('admin_vacancy_delete', vacancy_id=vacancy.id) }}"
               onclick="return confirm('Are you sure you want to delete this vacancy?');"
               class="hr-btn-delete">
               Delete Vacancy
            </a>
        </div>

    </form>

</div>

{% endblock %}
