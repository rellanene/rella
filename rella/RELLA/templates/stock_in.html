{% extends "base.html" %}
{% block title %}Stock In{% endblock %}
{% block content %}

<h1>Stock In</h1>

<style>
.btn-gold {
    background-color: #d4af37;
    color: black;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}
.btn-gold:hover { background-color: #b8952f; }

.btn-black {
    background-color: black;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}
.btn-black:hover { background-color: #222; }

.scan-input {
    width: 100%;
    padding: 8px;
    border: 2px solid #d4af37;
    border-radius: 4px;
    margin-bottom: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}
th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}
</style>

<!-- Manual Mode Toggle -->
<button id="toggleManual" class="btn-black" style="margin-bottom: 12px;">
    Manual Mode
</button>

<!-- Return Mode Toggle -->
<button id="toggleReturn" class="btn-black" style="margin-bottom: 12px; margin-left: 10px;">
    Return Mode
</button>

<!-- Remove Mode Toggle -->
<button id="toggleRemove" class="btn-black" style="margin-bottom: 12px; margin-left: 10px;">
    Remove Product
</button>

<form method="post" id="stockin-form" action="/stock_in">

    <!-- Hidden fields for backend -->
    <input type="hidden" name="is_return" id="isReturnField" value="0">
    <input type="hidden" name="is_remove" id="isRemoveField" value="0">

    <!-- SCAN BARCODE -->
    <label>Barcode:</label>
    <input id="barcode-input" class="scan-input" placeholder="Scan barcode..." autocomplete="off">

    <!-- STORE -->
    <label>Store:</label>
    <select name="store_id" id="storeSelect" class="scan-input" required>
        <option value="">Select Store</option>
        {% for s in stores %}
        <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
    </select>

    <!-- HIDDEN PRODUCT LIST FOR BARCODE MATCHING -->
    <select id="hiddenProductList" style="display:none;">
        {% for p in products %}
        <option value="{{ p.id }}" data-barcode="{{ p.barcode }}">{{ p.name }}</option>
        {% endfor %}
    </select>

    <!-- PRODUCT TABLE -->
    <table id="stockTable">
        <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button type="submit" id="submitBtn" class="btn-gold" style="margin-top: 15px;" disabled>
        Add Stock
    </button>

</form>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const barcodeInput = document.getElementById("barcode-input");
    const storeSelect = document.getElementById("storeSelect");
    const tableBody = document.querySelector("#stockTable tbody");
    const submitBtn = document.getElementById("submitBtn");
    const hiddenList = document.getElementById("hiddenProductList");

    let manualMode = false;
    let returnMode = false;
    let removeMode = false;

    /* ----------------------------------------------------
       MANUAL MODE TOGGLE
    ---------------------------------------------------- */
    document.getElementById("toggleManual").addEventListener("click", function () {
        manualMode = !manualMode;
        this.textContent = manualMode ? "Return to Scan Mode" : "Manual Mode";
        if (!manualMode) focusScanner();
    });

    function focusScanner() {
        if (!manualMode) {
            barcodeInput.focus();
            barcodeInput.select();
        }
    }

    focusScanner();

    document.addEventListener("click", function (e) {
        if (!manualMode && !barcodeInput.contains(e.target)) {
            focusScanner();
        }
    });

    /* ----------------------------------------------------
       RETURN MODE TOGGLE
    ---------------------------------------------------- */
    document.getElementById("toggleReturn").addEventListener("click", function () {
        returnMode = !returnMode;
        removeMode = false;

        this.textContent = returnMode ? "Return Mode: ON" : "Return Mode";
        document.getElementById("toggleRemove").textContent = "Remove Product";

        document.getElementById("isReturnField").value = returnMode ? "1" : "0";
        document.getElementById("isRemoveField").value = "0";

        Rella.toast(returnMode ? "Return Mode Enabled" : "Return Mode Disabled", "info");
    });

    /* ----------------------------------------------------
       REMOVE MODE TOGGLE
    ---------------------------------------------------- */
    document.getElementById("toggleRemove").addEventListener("click", function () {
        removeMode = !removeMode;
        returnMode = false;

        this.textContent = removeMode ? "Remove Mode: ON" : "Remove Product";
        document.getElementById("toggleReturn").textContent = "Return Mode";

        document.getElementById("isRemoveField").value = removeMode ? "1" : "0";
        document.getElementById("isReturnField").value = "0";

        Rella.toast(removeMode ? "Remove Mode Enabled" : "Remove Mode Disabled", "info");
    });

    /* ----------------------------------------------------
       ADD PRODUCT ROW
    ---------------------------------------------------- */
    function addProduct(productId, productName) {
        let existing = document.querySelector(`tr[data-id="${productId}"]`);

        if (existing) {
            existing.querySelector(".qty-input").focus();
            return;
        }

        let row = document.createElement("tr");
        row.setAttribute("data-id", productId);

        row.innerHTML = `
            <td>${productName}
                <input type="hidden" name="product_id[]" value="${productId}">
            </td>

            <td>
                <input type="number" name="quantity[]" class="qty-input" min="1" required placeholder="Qty">
            </td>

            <td>
                <button type="button" class="btn-black remove-btn">X</button>
            </td>
        `;

        tableBody.appendChild(row);

        row.querySelector(".remove-btn").addEventListener("click", () => {
            row.remove();
            validateForm();
        });

        row.querySelector(".qty-input").addEventListener("input", validateForm);

        row.querySelector(".qty-input").focus();

        validateForm();
    }

    /* ----------------------------------------------------
       PROCESS SCAN
    ---------------------------------------------------- */
    function processScan(code) {
        let option = [...hiddenList.options].find(o => o.dataset.barcode === code);

        if (!option) {
            Rella.toast("Product not found", "error");
            return;
        }

        if (removeMode) {
            addProduct(option.value, option.textContent + " (REMOVE)");
        }
        else if (returnMode) {
            addProduct(option.value, option.textContent + " (RETURN)");
        }
        else {
            addProduct(option.value, option.textContent);
        }
    }

    /* ----------------------------------------------------
       SCAN ENGINE
    ---------------------------------------------------- */
    barcodeInput.addEventListener("keyup", function(e) {
        if (e.key === "Enter") {
            const code = barcodeInput.value.trim();
            if (code.length > 0) processScan(code);
            barcodeInput.value = "";
            focusScanner();
        }
    });

    /* ----------------------------------------------------
       VALIDATION ENGINE
    ---------------------------------------------------- */
    function validateForm() {
        let valid = true;

        if (storeSelect.value === "") valid = false;

        document.querySelectorAll(".qty-input").forEach(input => {
            if (input.value.trim() === "" || parseInt(input.value) < 1) {
                valid = false;
            }
        });

        submitBtn.disabled = !valid;
    }

    storeSelect.addEventListener("change", validateForm);

});
</script>

{% endblock %}
