{% extends "base.html" %}
{% block title %}Stock In{% endblock %}
{% block content %}

<h1>Stock In</h1>

<style>
/* ===== Gold/Black Theme Buttons ===== */
.btn-gold {
    background-color: #d4af37;
    color: black;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}
.btn-gold:hover {
    background-color: #b8952f;
}

.btn-black {
    background-color: black;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}
.btn-black:hover {
    background-color: #222;
}
</style>

<!-- Manual Mode Toggle -->
<button id="toggleManual" class="btn-black" style="margin-bottom: 12px;">
    Manual Mode
</button>

<form method="post" class="add-form">

  <!-- Barcode -->
  <label>Barcode:</label>
  <input id="barcode-input" name="barcode" placeholder="Scan barcode" autofocus required>

  <!-- Product -->
  <label>Product:</label>
  <select name="product_id" required>
    <option value="">Select Product</option>
    {% for p in products %}
      <option value="{{ p.id }}">{{ p.name }}</option>
    {% endfor %}
  </select>

  <!-- Store -->
  <label>Store:</label>
  <select name="store_id" required>
    <option value="">Select Store</option>
    {% for s in stores %}
      <option value="{{ s.id }}">{{ s.name }}</option>
    {% endfor %}
  </select>

  <!-- Quantity -->
  <label>Quantity:</label>
  <input type="number" name="quantity" min="1" required>

  <button type="submit" class="btn-gold">Add Stock</button>
</form>

<script>
let manualMode = false;

document.getElementById("toggleManual").addEventListener("click", function () {
    manualMode = !manualMode;

    if (manualMode) {
        this.textContent = "Return to Scan Mode";
    } else {
        this.textContent = "Manual Mode";
        focusScanner();
    }
});

function focusScanner() {
    if (!manualMode) {
        const barcodeInput = document.getElementById("barcode-input");
        if (barcodeInput) {
            barcodeInput.focus();
            barcodeInput.select();
        }
    }
}

document.addEventListener("DOMContentLoaded", function () {
    focusScanner();

    document.addEventListener("click", function (e) {
        if (!manualMode) {
            const barcodeInput = document.getElementById("barcode-input");
            if (barcodeInput && !barcodeInput.contains(e.target)) {
                focusScanner();
            }
        }
    });
});
</script>

{% endblock %}
