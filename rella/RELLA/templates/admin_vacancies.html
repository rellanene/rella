<!DOCTYPE html>
<html>
<head>
    <title>Admin Vacancies</title>
</head>
<body>

<h2>Vacancies</h2>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Location</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for vac in vacancies %}
        <tr>
            <td>{{ vac.id }}</td>
            <td>{{ vac.title }}</td>
            <td>{{ vac.location }}</td>
            <td>{{ vac.created_at }}</td>
            <td>
                <a href="{{ url_for('admin_vacancy_edit', vacancy_id=vac.id) }}">Edit</a> |
                <a href="{{ url_for('admin_vacancy_delete', vacancy_id=vac.id) }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
