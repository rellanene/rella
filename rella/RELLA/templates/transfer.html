{% extends "base.html" %}
{% block title %}Stock In{% endblock %}
{% block content %}

<h1>Stock In</h1>

<style>
    /* ===== Layout & Theme ===== */
    .form-container {
        max-width: 1100px;
        margin: 30px auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
    }

    label {
        font-weight: 600;
        margin-right: 4px;
        font-size: 14px;
    }

    .scan-input {
        width: 160px;
        padding: 6px 8px;
        font-size: 14px;
        border: 2px solid #d4af37;
        border-radius: 5px;
        margin-right: 8px;
    }

    /* ===== Gold/Black Theme Buttons ===== */
    .btn-gold {
        background-color: #d4af37;
        color: black;
        border: none;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
    }
    .btn-gold:hover {
        background-color: #b8952f;
    }

    .btn-black {
        background-color: black;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
    }
    .btn-black:hover {
        background-color: #222;
    }
</style>

<!-- Manual Mode Toggle -->
<button id="toggleManual" class="btn-black" style="margin-bottom: 10px;">
    Manual Mode
</button>

<div class="form-container">
    <form method="post" class="add-form" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
        <label>Barcode:</label>
        <input id="barcode-input" name="barcode" class="scan-input" placeholder="Scan barcode" autofocus required>

        <label>Product:</label>
        <select name="product_id" class="scan-input" required>
            <option value="">Select Product</option>
            {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }}</option>
            {% endfor %}
        </select>

        <label>Store:</label>
        <select name="store_id" class="scan-input" required>
            <option value="">Select Store</option>
            {% for s in stores %}
                <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
        </select>

        <label>Quantity:</label>
        <input type="number" name="quantity" class="scan-input" min="1" required>

        <button type="submit" class="btn-gold">Add Stock</button>
    </form>
</div>

<script>
let manualMode = false;

document.getElementById("toggleManual").addEventListener("click", function () {
    manualMode = !manualMode;

    if (manualMode) {
        this.textContent = "Return to Scan Mode";
    } else {
        this.textContent = "Manual Mode";
        focusScanner();
    }
});

function focusScanner() {
    if (!manualMode) {
        const barcodeInput = document.getElementById("barcode-input");
        if (barcodeInput) {
            barcodeInput.focus();
            barcodeInput.select();
        }
    }
}

document.addEventListener("DOMContentLoaded", function () {
    focusScanner();

    document.addEventListener("click", function (e) {
        if (!manualMode) {
            const barcodeInput = document.getElementById("barcode-input");
            if (barcodeInput && !barcodeInput.contains(e.target)) {
                focusScanner();
            }
        }
    });
});
</script>

{% endblock %}
